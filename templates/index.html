<!DOCTYPE html>
<html>
<head><title>Board</title></head>
<body>
  <h1>Comment Board</h1>

  <form method="POST">
    <input name="name" placeholder="Name" required><br><br>
    <textarea name="message" placeholder="Comment" required></textarea><br><br>
    <button type="submit">Submit</button>
  </form>

  <hr>
  {% for name, message in messages %}
    <p><b>{{ name }}</b>：{{ message }}</p>
  {% endfor %}
</body>
</html>
